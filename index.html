
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 타워 디펜스</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 12px;
  background: #101827; color: white;
  font-family: system-ui, sans-serif;
}
h2 { text-align: center; }
#stats {
  display: flex; justify-content: space-around;
  padding: 12px; background: #263449;
  border-radius: 10px; margin-bottom: 10px;
}
canvas {
  display: block; width: 100%; height: 60vh;
  background: #90bc78; border-radius: 10px;
  touch-action: manipulation;
}
button {
  padding: 13px; border: 0; border-radius: 8px;
  background: #2563eb; color: white;
  font-size: 15px; font-weight: bold;
}
.controls { display: flex; gap: 8px; margin-top: 10px; }
.controls button { flex: 1; }
#msg { text-align: center; min-height: 28px; }
</style>
</head>
<body>
<h2>🏰 미니 타워 디펜스</h2>
<div id="stats">
  <span>🪙 <b id="gold">120</b></span>
  <span>❤️ <b id="hp">10</b></span>
  <span>🌊 <b id="wave">0</b></span>
</div>
<canvas id="game"></canvas>
<p id="msg">타워 설치를 누르고 잔디를 터치하세요!</p>
<div class="controls">
  <button id="build">타워 설치 (60)</button>
  <button id="start">웨이브 시작</button>
</div>
<div class="controls">
  <button id="reset">다시 시작</button>
</div>

<script>
const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

let W, H, path, towers, enemies, bullets;
let gold, hp, wave, active, building, left, timer, last;
let ended = false;

function init() {
  gold = 120; hp = 10; wave = 0;
  towers = []; enemies = []; bullets = [];
  active = false; building = false;
  left = 0; timer = 0; last = 0; ended = false;
  resize();
  ui();
  $("msg").textContent = "타워 설치를 누르고 잔디를 터치하세요!";
}
function resize() {
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  path = [
    {x:0,y:H*.2}, {x:W*.3,y:H*.2},
    {x:W*.3,y:H*.48}, {x:W*.7,y:H*.48},
    {x:W*.7,y:H*.78}, {x:W,y:H*.78}
  ];
  draw();
}
window.addEventListener("resize", resize);
function dist(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }
function ui() {
  $("gold").textContent = gold;
  $("hp").textContent = hp;
  $("wave").textContent = wave;
}
function onPath(p) {
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i];
    const dx=b.x-a.x,dy=b.y-a.y;
    const t=Math.max(0,Math.min(1,
      ((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));
    if(dist(p,{x:a.x+t*dx,y:a.y+t*dy})<25) return true;
  }
  return false;
}
$("build").onclick = () => {
  if(ended) return;
  building = true;
  $("msg").textContent = "타워를 설치할 잔디를 터치하세요.";
};
$("start").onclick = () => {
  if(active || ended) return;
  wave++;
  left = 5 + wave*2;
  timer = 0;
  active = true;
  $("msg").textContent = "적이 다가오고 있습니다!";
  ui();
};
$("reset").onclick = init;

canvas.addEventListener("pointerdown", e => {
  if(!building || ended) return;
  const r = canvas.getBoundingClientRect();
  const p = {x:e.clientX-r.left,y:e.clientY-r.top};
  if(onPath(p)) {
    $("msg").textContent = "길 위에는 설치할 수 없습니다.";
    return;
  }
  if(towers.some(t=>dist(t,p)<32)) {
    $("msg").textContent = "다른 타워와 너무 가까워요.";
    return;
  }
  if(gold<60) {
    $("msg").textContent = "골드가 부족합니다.";
    return;
  }
  gold-=60;
  towers.push({...p,cool:0,range:105});
  building=false;
  $("msg").textContent = "타워 설치 완료!";
  ui();
});

function spawn() {
  const p=path[0];
  enemies.push({
    x:p.x,y:p.y,i:1,
    hp:2+Math.floor(wave/2),
    max:2+Math.floor(wave/2),
    speed:35+wave*3
  });
}
function update(dt) {
  if(active && left>0) {
    timer-=dt;
    if(timer<=0) { spawn(); left--; timer=.8; }
  }
  for(const e of enemies) {
    let move=e.speed*dt;
    while(move>0 && e.i<path.length) {
      const p=path[e.i], d=dist(e,p);
      if(d<=move) {
        e.x=p.x; e.y=p.y; move-=d; e.i++;
      } else {
        e.x+=(p.x-e.x)*move/d;
        e.y+=(p.y-e.y)*move/d;
        move=0;
      }
    }
    if(e.i>=path.length && !e.escaped) {
      e.escaped=true; hp--;
    }
  }
  enemies=enemies.filter(e=>!e.escaped && e.hp>0);

  for(const t of towers) {
    t.cool-=dt;
    if(t.cool<=0) {
      const e=enemies.find(e=>dist(t,e)<=t.range);
      if(e) {
        bullets.push({x:t.x,y:t.y,target:e,speed:240});
        t.cool=.55;
      }
    }
  }
  for(const b of bullets) {
    const e=b.target;
    if(!enemies.includes(e)) { b.dead=true; continue; }
    const d=dist(b,e), move=b.speed*dt;
    if(d<=move+5) {
      b.dead=true; e.hp--;
      if(e.hp<=0) gold+=10;
    } else if(d>0) {
      b.x+=(e.x-b.x)*move/d;
      b.y+=(e.y-b.y)*move/d;
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  enemies=enemies.filter(e=>e.hp>0);

  if(active && left===0 && enemies.length===0) {
    active=false; gold+=25;
    $("msg").textContent = "방어 성공! 보너스 골드 +25";
  }
  if(hp<=0) {
    hp=0; active=false; ended=true;
    $("msg").textContent = "게임 오버! 다시 시작하세요.";
  }
  ui();
}
function draw() {
  if(!W || !H) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#90bc78";
  ctx.fillRect(0,0,W,H);

  ctx.beginPath();
  path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="#d9c49b"; ctx.lineWidth=34; ctx.stroke();
  ctx.strokeStyle="#b29a70"; ctx.lineWidth=2;
  ctx.setLineDash([6,7]); ctx.stroke(); ctx.setLineDash([]);

  for(const t of towers) {
    ctx.fillStyle="rgba(37,99,235,.12)";
    ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#1d4ed8";
    ctx.beginPath(); ctx.arc(t.x,t.y,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="white"; ctx.fillRect(t.x-3,t.y-10,6,20);
    ctx.fillRect(t.x-10,t.y-3,20,6);
  }
  for(const e of enemies) {
    ctx.fillStyle="#dc2626";
    ctx.beginPath(); ctx.arc(e.x,e.y,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fee2e2"; ctx.fillRect(e.x-12,e.y-17,24,4);
    ctx.fillStyle="#22c55e";
    ctx.fillRect(e.x-12,e.y-17,24*Math.max(0,e.hp/e.max),4);
  }
  ctx.fillStyle="#fef08a";
  for(const b of bullets) {
    ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill();
  }
}
function loop(time) {
  const dt=last?Math.min((time-last)/1000,.04):0;
  last=time;
  if(active && !ended) update(dt);
  draw();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
